# Full research configuration. All split boundaries are fixed here BEFORE any modelling.
# Boundaries were set after the data audit confirmed date_id 0..480 (481 complete trading days).

name = "full"
seed = 42
artifacts_dir = "artifacts/full"
reports_dir = "reports"

[data]
zip_path = "C:/Users/arjun/Downloads/optiver-trading-at-the-close.zip"
raw_dir = "data/raw"
processed_dir = "data/processed"
# optional: restrict to dates <= max_date_id (None = all). Used by smoke mode.
max_date_id = -1
stock_subset = []          # empty = all stocks

[resources]
n_threads = 4              # physical cores on the dev machine; override with OPTIVER_THREADS
float_dtype = "float32"
# Fraction of training rows (sampled by whole date_id, deterministic) used in *ablation* runs only.
ablation_date_fraction = 0.5

[splits]
# Final untouched holdout: last 60 dates.
holdout_start = 421
holdout_end = 480
# Expanding-window development folds: train on [train_start, val_start-1], validate on [val_start, val_end].
train_start = 0
embargo_days = 0           # labels are intraday (t+60s within the same auction); see reports/validation_design.md
folds = [
    { name = "fold1", val_start = 301, val_end = 340 },
    { name = "fold2", val_start = 341, val_end = 380 },
    { name = "fold3", val_start = 381, val_end = 420 },
]

[features]
lags_seconds = [10, 30, 60]
roll_window_seconds = 60
families = ["book", "auction", "interact", "temporal", "xsec", "stock"]

[lgbm]
objective = "l1"
n_estimators = 3000
early_stopping_rounds = 100
log_every = 100
# Candidate configurations evaluated on development folds (bounded budget).
[[lgbm.candidates]]
name = "lgb_base"
learning_rate = 0.05
num_leaves = 127
min_data_in_leaf = 500
feature_fraction = 0.7
bagging_fraction = 0.7
bagging_freq = 1
lambda_l2 = 1.0
max_bin = 255

[[lgbm.candidates]]
name = "lgb_small"
learning_rate = 0.05
num_leaves = 31
min_data_in_leaf = 1000
feature_fraction = 0.7
bagging_fraction = 0.7
bagging_freq = 1
lambda_l2 = 1.0
max_bin = 255

[[lgbm.candidates]]
name = "lgb_large"
learning_rate = 0.05
num_leaves = 255
min_data_in_leaf = 300
feature_fraction = 0.6
bagging_fraction = 0.7
bagging_freq = 1
lambda_l2 = 5.0
max_bin = 255

[ridge]
alphas = [1.0, 100.0, 10000.0]
clip_quantile = 0.001

[backtest]
decision_seconds = [0, 60, 120, 180, 240, 300, 360, 420, 480, 540]
gross_exposure = 1.0
min_names_per_side = 10
cost_bps_per_side = [0.0, 0.5, 1.0, 2.0]
bootstrap_reps = 2000
bootstrap_block_days = 5
# Rule grid chosen on development OOF predictions only, then frozen.
weight_caps = [0.02, 0.05]
selection_quantiles = [1.0, 0.4, 0.2]   # 1.0 = all names; 0.2 = top/bottom 20% by demeaned signal
selection_cost_bps = 0.5                # per-side cost at which the dev rule is selected

[streaming]
history_seconds = 60       # bounded history kept per stock (>= max lag and rolling window)
strict_order = false
